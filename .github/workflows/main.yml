name: Build & Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Sanitizer Suites
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: MacKernelSDK
      - name: Run isolated Wi-Fi & Bluetooth ASan/UBSan test suites
        run: python3 scripts/run-tests.py --jobs 4

  build:
    name: Sequoia Suite (${{ matrix.configuration }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: MacKernelSDK
      - name: Build AirportItlwm_Sequoia.kext (${{ matrix.configuration }})
        run: |
          set -euo pipefail
          if [ "${{ matrix.configuration }}" = "Debug" ]; then
            python3 scripts/build-sequoia.py --configuration Debug --jobs 4 --check-shared
          else
            python3 scripts/build-sequoia.py --configuration Release --jobs 4
          fi
      - name: Build Bluetooth Companion Kexts (${{ matrix.configuration }})
        run: |
          set -euo pipefail
          python3 scripts/build-bluetooth.py bluetool --configuration "${{ matrix.configuration }}" --jobs 4
          python3 scripts/build-bluetooth.py firmware --configuration "${{ matrix.configuration }}" --jobs 4
      - name: Package Wi-Fi & Bluetooth Kexts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          short_sha=$(git rev-parse --short HEAD)
          cfg=$(printf '%s' "${{ matrix.configuration }}" | tr '[:lower:]' '[:upper:]')
          ditto -c -k --keepParent "build/Sequoia-${{ matrix.configuration }}/AirportItlwm_Sequoia.kext" "artifacts/AirportItlwm-Sequoia-v2.5.1-${cfg}-${short_sha}.zip"
          ditto -c -k --keepParent "build/bluetooth/products/bluetool/${{ matrix.configuration }}/BlueToolFixup.kext" "artifacts/BlueToolFixup-v2.7.3-${cfg}-${short_sha}.zip"
          ditto -c -k --keepParent "build/bluetooth/products/firmware/${{ matrix.configuration }}/IntelBluetoothFirmware.kext" "artifacts/IntelBluetoothFirmware-v2.5.1-${cfg}-${short_sha}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Continuity-Sequoia-Suite-${{ matrix.configuration }}
          path: artifacts/*.zip
          if-no-files-found: error
