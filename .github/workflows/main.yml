name: Build & Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Sanitizer Suites
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: MacKernelSDK
      - name: Run isolated ASan/UBSan test suites
        run: python3 scripts/run-tests.py --jobs 4

  build:
    name: Sequoia (${{ matrix.configuration }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: MacKernelSDK
      - name: Build AirportItlwm_Sequoia.kext (${{ matrix.configuration }})
        run: |
          set -euo pipefail
          extra_flags=()
          if [ "${{ matrix.configuration }}" = "Debug" ]; then
            extra_flags+=(--check-shared)
          fi
          python3 scripts/build-sequoia.py --configuration "${{ matrix.configuration }}" --jobs 4 "${extra_flags[@]}"
      - name: Package kernel extension
        run: |
          set -euo pipefail
          mkdir -p artifacts
          version=$(python3 -c 'import re, pathlib; print(re.search(r"^VERSION\s*=\s*\"([^\"]+)\"", pathlib.Path("scripts/build-sequoia.py").read_text(), re.M).group(1))')
          short_sha=$(git rev-parse --short HEAD)
          cfg=$(printf '%s' "${{ matrix.configuration }}" | tr '[:lower:]' '[:upper:]')
          out_zip="artifacts/AirportItlwm-Sequoia-v${version}-${cfg}-${short_sha}.zip"
          ditto -c -k --keepParent "build/Sequoia-${{ matrix.configuration }}/AirportItlwm_Sequoia.kext" "$out_zip"
      - uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-Sequoia-${{ matrix.configuration }}
          path: artifacts/AirportItlwm-Sequoia-*.zip
          if-no-files-found: error
